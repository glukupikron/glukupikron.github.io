<html lang="en">

<div class="eventTemplate nekoGrid" onclick = 'stopScroll()'>

    </div>
    <div class="nekoRow2">
      While you wait, you’ve spotted a Sacred Cat named Neko.

    </div>
</div>

<!--하나비 구역-->
<div class ="eventTemplate hanabi" onclick = 'stopScroll()'>
  <div class="hanabiRow1">
    
  </div>
  <div class="hanabiRow2">
    <span style = "background-color: rgba(255, 255, 255, 0.5)">Would you like to wait for the hanabi to start again?</span>
    <div class="select-wrapper">
      <select class="custom-select" onclick="event.stopPropagation()" onchange = "selectHanabi(this)">
        <option value="" disabled selected>huh?</option>
        <option>yes</option>
        <option>no</option>
      </select>
      <div class="select-arrow">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#6b7280" stroke="none"><polygon points="6,9 18,9 12,16"/></svg>
  </div>
</div>
  </div>
</div>
    

<!--코인 구역-->
<div class = "coinImage"></div>

<!-- 담배 구역-->
 <div class = "tabakoImage">

 </div>


<!--퍼즐 테스트-->





<!--이벤트 소스-->
<div id = "eventSources" hidden>

      <img src = "use_image/letters.png" class = "lettersImage">
      <div class = "clipGlow">
        <img src = "use_image/letters.png" class = "clipImage" >
        <p class = "letterGuide"> Discover your paper to write on. </p>
      </div>
     
      <div class = "letterPaper">
       <img src = "use_image/paper-image.png">
       <p class = "writtenLetter">  </p>
       <div class="input-wrapper">
          <input maxlength="280"
            class="custom-input"
            type="text"
            placeholder="Words..."
          />
          <button class = letterButton>write</button>
      </div>
      </div>
   </div>

   <!--다른 div들-->

</div>
